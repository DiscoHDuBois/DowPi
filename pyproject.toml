[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dowpi"
version = "0.1.0"
description = "Converte PDF in Markdown ottimizzato per gli LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "click>=8.1",
]

[project.scripts]
dowpi = "dowpi.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dowpi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
